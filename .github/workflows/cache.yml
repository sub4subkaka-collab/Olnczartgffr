name: build-cache

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["task-runner"]
    types: [completed]

concurrency:
  group: cache-rebuild
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Setup
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - name: Read current cache key
        id: cachekey
        run: echo "value=$(tr -d '[:space:]' < key.txt)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: requirements-job.txt

      - name: Install dependencies
        run: pip install -r requirements-job.txt

      - name: Restore current cache for inspection
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: ${{ steps.cachekey.outputs.value }}

      - name: Validate cache / warm if stale
        id: bootstrap
        run: bash bootstrap_cache.sh validate_and_warm

      - name: Save cache under new key
        if: steps.bootstrap.outputs.valid == 'false'
        uses: actions/cache/save@v4
        with:
          path: cache
          key: ${{ steps.bootstrap.outputs.newkey }}

      - name: Point key.txt at the new key
        if: steps.bootstrap.outputs.valid == 'false'
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PRIVATE_REPO_NAME: ${{ secrets.PRIVATE_REPO_NAME }}
        run: bash bootstrap_cache.sh update_key "${{ steps.bootstrap.outputs.newkey }}"
